<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Sio Dhago | Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: { fontFamily: { sans: ['-apple-system', 'BlinkMacSystemFont', '"SF Pro Display"', '"SF Pro Text"', 'Inter', 'sans-serif'] } }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .glass-hdr { background: rgba(255, 255, 255, 0.55); backdrop-filter: blur(28px); border-bottom: 1px solid rgba(255, 255, 255, 0.4); }
        .dark .glass-hdr { background: rgba(15, 15, 22, 0.65); border-bottom: 1px solid rgba(255, 255, 255, 0.08); }
        .glass-card { background: rgba(255, 255, 255, 0.45); backdrop-filter: blur(24px); border: 1px solid rgba(255, 255, 255, 0.5); box-shadow: 0 16px 40px rgba(31, 38, 135, 0.06); }
        .dark .glass-card { background: rgba(24, 24, 32, 0.5); border: 1px solid rgba(255, 255, 255, 0.08); box-shadow: 0 16px 40px rgba(0, 0, 0, 0.35); }
        .glass-pill { background: rgba(255, 255, 255, 0.65); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.6); }
        .dark .glass-pill { background: rgba(30, 30, 42, 0.65); border: 1px solid rgba(255, 255, 255, 0.1); }
        .glass-modal { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(35px); border: 1px solid rgba(255, 255, 255, 0.6); }
        .dark .glass-modal { background: rgba(18, 18, 26, 0.88); border: 1px solid rgba(255, 255, 255, 0.12); }
    </style>
</head>
<body class="bg-slate-100 dark:bg-zinc-950 text-zinc-900 dark:text-zinc-100 font-sans min-h-screen flex flex-col pb-20">

    <header class="fixed top-0 inset-x-0 z-40 glass-hdr h-20 flex items-center justify-between px-6 sm:px-8">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-rose-500 to-purple-600 flex items-center justify-center text-white shadow-lg">
                <i class="fa-solid fa-gauge-high text-lg"></i>
            </div>
            <div>
                <span class="text-lg font-extrabold bg-gradient-to-r from-rose-600 to-purple-600 bg-clip-text text-transparent">Sio Dhago Admin</span>
                <p class="text-[10px] text-zinc-500">Live Orders Dashboard</p>
            </div>
        </div>
        <div class="glass-pill px-3 py-1.5 rounded-full text-xs font-bold flex items-center space-x-2">
            <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
            <span>Live Sync Active</span>
        </div>
    </header>

    <main class="flex-grow pt-28 max-w-7xl mx-auto w-full px-4 sm:px-8">
        <section class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-8">
            <div class="glass-card p-6 rounded-3xl">
                <span class="text-xs font-bold text-zinc-500 uppercase">Total Revenue</span>
                <div id="stat-revenue" class="text-2xl font-extrabold mt-1">Rs. 0</div>
            </div>
            <div class="glass-card p-6 rounded-3xl">
                <span class="text-xs font-bold text-zinc-500 uppercase">Total Orders</span>
                <div id="stat-orders" class="text-2xl font-extrabold mt-1">0</div>
            </div>
            <div class="glass-card p-6 rounded-3xl">
                <span class="text-xs font-bold text-zinc-500 uppercase">Pending</span>
                <div id="stat-pending" class="text-2xl font-extrabold mt-1 text-amber-600">0</div>
            </div>
            <div class="glass-card p-6 rounded-3xl">
                <span class="text-xs font-bold text-zinc-500 uppercase">Avg Order Value</span>
                <div id="stat-aov" class="text-2xl font-extrabold mt-1">Rs. 0</div>
            </div>
        </section>

        <section class="glass-card rounded-3xl p-6">
            <h2 class="text-xl font-extrabold mb-4">Orders Management</h2>
            <div class="overflow-x-auto rounded-2xl border border-zinc-200/50 dark:border-zinc-800/50">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="glass-hdr text-[10px] font-extrabold uppercase text-zinc-500">
                            <th class="p-3.5">Order ID</th>
                            <th class="p-3.5">Customer</th>
                            <th class="p-3.5">Summary</th>
                            <th class="p-3.5">Total</th>
                            <th class="p-3.5">Status</th>
                        </tr>
                    </thead>
                    <tbody id="orders-table-body" class="divide-y divide-zinc-200/50 dark:divide-zinc-800/50 text-xs"></tbody>
                </table>
            </div>
        </section>
    </main>

    <script>
        let orders = [];

        function updateKPIMetrics() {
            const totalRev = orders.reduce((sum, o) => sum + (o.totalAmount || 0), 0);
            document.getElementById('stat-revenue').innerText = `Rs. ${totalRev.toLocaleString()}`;
            document.getElementById('stat-orders').innerText = orders.length;
            document.getElementById('stat-pending').innerText = orders.filter(o => o.status === 'Pending').length;
            document.getElementById('stat-aov').innerText = orders.length ? `Rs. ${Math.round(totalRev / orders.length).toLocaleString()}` : 'Rs. 0';
        }

        function renderOrdersTable() {
            const tbody = document.getElementById('orders-table-body');
            if (orders.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="p-8 text-center text-zinc-400">No orders placed yet. Try placing an order from your main shop page!</td></tr>`;
                return;
            }
            tbody.innerHTML = orders.map(o => `
                <tr class="hover:bg-white/40 dark:hover:bg-zinc-800/40">
                    <td class="p-3.5 font-mono font-bold text-rose-600">${o.id}</td>
                    <td class="p-3.5 font-bold">${o.customerName}<br><span class="text-[10px] text-zinc-500 font-normal">${o.phone}</span></td>
                    <td class="p-3.5">${(o.items || []).map(i => `${i.name} (x${i.qty})`).join(', ')}</td>
                    <td class="p-3.5 font-bold">Rs. ${(o.totalAmount || 0).toLocaleString()}</td>
                    <td class="p-3.5">
                        <select onchange="updateStatus('${o.id}', this.value)" class="text-xs font-bold px-2.5 py-1 rounded-full border bg-transparent cursor-pointer">
                            <option value="Pending" ${o.status === 'Pending' ? 'selected' : ''}>Pending</option>
                            <option value="Processing" ${o.status === 'Processing' ? 'selected' : ''}>Processing</option>
                            <option value="Shipped" ${o.status === 'Shipped' ? 'selected' : ''}>Shipped</option>
                            <option value="Delivered" ${o.status === 'Delivered' ? 'selected' : ''}>Delivered</option>
                            <option value="Cancelled" ${o.status === 'Cancelled' ? 'selected' : ''}>Cancelled</option>
                        </select>
                    </td>
                </tr>
            `).join('');
        }
    </script>
    <script type="module">
        import { firebaseConfig } from "./firebase-config.js";
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getFirestore, collection, query, orderBy, onSnapshot, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.updateStatus = async (id, status) => {
            await updateDoc(doc(db, "orders", id), { status });
        };

        onSnapshot(query(collection(db, "orders"), orderBy("timestamp", "desc")), snap => {
            orders = snap.docs.map(d => ({ id: d.id, ...d.data() }));
            updateKPIMetrics();
            renderOrdersTable();
        });
    </script>
</body>
</html>
